[project]
name = "portfolio-django-cf"
version = "1.0.0"
description = "Portfolio website on Cloudflare Workers"
requires-python = ">=3.12"
dependencies = [
    "jinja2",
]

[dependency-groups]
dev = [
    "workers-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
